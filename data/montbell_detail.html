<script>
  document.addEventListener('DOMContentLoaded', initDialogDeliveryNotice);

  function initDialogDeliveryNotice() {

    // ヘッダー非表示の場合は表示しない
    if ("") {
      return;
    }

    // グローバルトップページでは表示しない
    if (window.location.pathname === '/') {
      return;
    }

    // カート決裁画面では表示しない
    if (document.body.classList.contains('cannot-location-change')) {
      return;
    }

    // Cookieがある場合は表示しない
    if (document.cookie.includes('delivery_notice_shown=true')) {
      return;
    }

    const dialogDeliveryNotice = document.querySelector('.popup-dialog.delivery-notice');
    const dialogContent = dialogDeliveryNotice.querySelector('.dialog-content');
    const noticeAgree = dialogDeliveryNotice.querySelector('.js-delivery-notice-agree');
    const noticeClose = dialogDeliveryNotice.querySelector('.js-delivery-notice-close');

    // ページロード後2秒でダイアログを表示し、アニメーション開始
    setTimeout(() => {
      dialogDeliveryNotice.classList.remove('hidden');

      // open 属性を付与してダイアログ自体を表示
      dialogDeliveryNotice.setAttribute('open', '');
      // 次のレンダリングサイクルで visible クラスを追加する
      setTimeout(() => {
        dialogContent.classList.add('visible');
      }, 50);
    }, 2000);

    // ダイアログを閉じる処理
    function closeDialog() {
      dialogContent.classList.add('fade-off');
      setTimeout(() => {
        dialogDeliveryNotice.removeAttribute('open');
        // Cookieを設定（90日間有効）
        document.cookie = 'delivery_notice_shown=true; path=/; max-age=' + (90 * 24 * 60 * 60);
      }, 300);
    }

    noticeAgree.addEventListener('click', closeDialog);
    noticeClose.addEventListener('click', closeDialog);
  }
</script>

<!-- 関連アイテム系削除 .js-history-delete : 閲覧履歴・関連商品用  -->
<!-- スライダー - original - .js-items-slider : 閲覧履歴・関連商品用  -->
<script>
  window.refreshJsItemsSlider = function(miniProductList) { // Modified
    // スライダーコンテナを取得
    const sliderContainers = miniProductList.querySelectorAll('.js-items-slider'); // Modified

    sliderContainers.forEach((container) => {
      // ボタンとトラックの要素を取得
      const prevButton = container.querySelector('.prev-button');
      const nextButton = container.querySelector('.next-button');
      const itemList = container.querySelector('.cols-items-list');

      // アイテム間の間隔とスライド幅
      let gapWidth = 41; //48;
      let slideWidth = 281; //308;

      // スライド関連の変数
      let slideCount = 0;
      let minSlideCount = 0;
      let maxSlideCount = 0;
      let touchStartX = null;
      let touchDeltaX = 0;
      let isSwiping = false;

      // 初回のスライド幅を設定
      setSlideWidth(); // 初回の位置更新含む

      // ウィンドウ幅の変更を監視し、スライドの幅を適切に設定
      window.addEventListener('resize', setSlideWidth);

      // 最初はprevボタンを無効化
      prevButton.disabled = true;

      // タッチイベントのハンドラー
      container.addEventListener('touchstart', handleTouchStart);
      container.addEventListener('touchmove', handleTouchMove);
      container.addEventListener('touchend', handleTouchEnd);

      // ボタンクリックのイベントリスナー
      nextButton.onclick = (event) => nextSlide(event, 1);
      prevButton.onclick = (event) => prevSlide(event, 1);

      // スワイプ開始時の処理
      function handleTouchStart(e) {
        touchStartX = e.touches[0].clientX;
        touchDeltaX = 0;
        isSwiping = true;
      }

      // スワイプ中の処理
      function handleTouchMove(e) {
        if (touchStartX !== null && isSwiping) {
          touchDeltaX = e.touches[0].clientX - touchStartX;
          const touchMoveAbsolute = Math.abs(touchDeltaX); // 絶対値

          // スワイプ方向が右で、かつ最初のスライド位置の場合に移動量を制限
          if (touchDeltaX > 0 && slideCount === minSlideCount) {
            const maxDeltaX = touchDeltaX / 4; // 制限値をスワイプ量の4分の1に設定
            touchDeltaX = Math.min(touchDeltaX, maxDeltaX);
          }

          if (touchMoveAbsolute >= 10) {
            const translateX = -slideCount * slideWidth + touchDeltaX;
            itemList.style.transform = `translateX(${translateX}px)`;

            // デフォルトのスクロール動作を無効化（スワイプ中の上下するロール制御）
            if (e.cancelable) { // コンソールエラーが出ないようにcancelableで分岐
              e.preventDefault();
            }
          }
        }
      }

      // スワイプ終了時の処理
      function handleTouchEnd(e) {
        const event = e; // event を e から取得
        if (touchDeltaX !== 0 && isSwiping) {
          const touchMoveAbsolute = Math.abs(touchDeltaX); // 絶対値
          const numItemsToSlide = Math.floor(touchMoveAbsolute / slideWidth);
          if (touchDeltaX > 0) {
            // スワイプ右
            // スワイプ量が50px以上でスライド実行
            if (touchMoveAbsolute < slideWidth && touchMoveAbsolute >= 50) {
              prevSlide(event, numItemsToSlide + 1);
            } else {
              prevSlide(event, numItemsToSlide);
            }
          } else {
            // スワイプ左
            // スワイプ量が50px以上でスライド実行
            if (touchMoveAbsolute < slideWidth && touchMoveAbsolute >= 50) {
              nextSlide(event, numItemsToSlide + 1);
            } else {
              nextSlide(event, numItemsToSlide);
            }
          }

          // スワイプが右に行き過ぎた場合、手を離すとtranslateXを0に
          if (touchDeltaX > 0 && slideCount === minSlideCount) {
            itemList.style.transform = 'translateX(0)';
          }

          // タッチ関連の変数をリセット
          touchStartX = null;
          touchDeltaX = 0;
          isSwiping = false;
        }
      }

      // マウス関連の変数
      const ctrlTrack = container.querySelector('.controller-track');
      let isDragging = false;
      let mouseStartX = null;
      let mouseDeltaX = 0;

      // マウスイベントのハンドラー
      ctrlTrack.addEventListener('mousedown', handleMouseDown);
      ctrlTrack.addEventListener('mousemove', handleMouseMove);
      ctrlTrack.addEventListener('mouseup', handleMouseUp);
      ctrlTrack.addEventListener('mouseleave', handleMouseUp);

      // マウスダウン時の処理
      function handleMouseDown(e) {
        mouseStartX = e.clientX;
        mouseDeltaX = 0;
        isDragging = true;

        // マウスダウン時に.is-draggingを削除
        itemList.classList.remove('is-dragging');
      }

      // マウス移動時の処理
      function handleMouseMove(e) {
        if (mouseStartX !== null && isDragging) {
          mouseDeltaX = e.clientX - mouseStartX;

          // スワイプ方向が右で、かつ最初のスライド位置の場合に移動量を制限
          if (mouseDeltaX > 0 && slideCount === minSlideCount) {
            const maxDeltaX = mouseDeltaX / 4; // 制限値をスワイプ量の4分の1に設定
            mouseDeltaX = Math.min(mouseDeltaX, maxDeltaX);
            mouseDeltaX = 0;
          }

          const translateX = -slideCount * slideWidth + mouseDeltaX;
          itemList.style.transform = `translateX(${translateX}px)`;

          // マウスドラッグ中に.is-draggingを付与
          itemList.classList.add('is-dragging');

          // マウスドラッグ中にテキスト選択を不可に
          document.addEventListener("selectstart", function(e) {
            e.preventDefault()
          });
        }
      }

      // マウスアップ時の処理
      function handleMouseUp() {
        if (mouseDeltaX !== 0 && isDragging) {
          const numItemsToSlide = Math.floor(Math.abs(mouseDeltaX) / slideWidth);
          if (mouseDeltaX > 0) {
            // マウスドラッグ右
            prevSlide(event, numItemsToSlide);
          } else {
            // マウスドラッグ左
            nextSlide(event, numItemsToSlide);
          }

          // マウスが右に行き過ぎた場合、translateXを0に
          if (mouseDeltaX > 0 && slideCount === minSlideCount) {
            itemList.style.transform = 'translateX(0)';
          }

          // マウス関連の変数をリセット
          mouseStartX = null;
          mouseDeltaX = 0;
          isDragging = false;

          // マウスアップ時に.is-draggingを削除
          itemList.classList.remove('is-dragging');
        }
      }

      // ブラウザバックで戻った時（ページがキャッシュから復元された時）の処理
      window.addEventListener('pageshow', function(event) {
        isDragging = false;
      });

      // スライドを進める処理
      function nextSlide(event, numItems) {
        // ダブルタップ時の拡大を防ぐ
        event.preventDefault();
        slideCount += numItems;
        slideCount = Math.min(slideCount, maxSlideCount);
        updateSliderPosition();
        if (slideCount > minSlideCount) {
          prevButton.disabled = false;
        }
      }

      // スライドを戻す処理
      function prevSlide(event, numItems) {
        // ダブルタップ時の拡大を防ぐ
        event.preventDefault();
        if (slideCount > minSlideCount) {
          slideCount -= numItems;
          slideCount = Math.max(slideCount, minSlideCount);
          updateSliderPosition();
          if (slideCount === minSlideCount) {
            prevButton.disabled = true;
          }
        }
      }

      // スライド幅の設定
      function setSlideWidth() {
        slideWidth = window.innerWidth < 992 ? 174.5 : 281; //308;
        gapWidth = window.innerWidth < 992 ? 14.5 : 41; //48;
        updateSliderPosition();
      }

      // スライド位置の更新
      function updateSliderPosition() {
        // .related-items-item に .is-close クラスが付与されていないものだけをカウント
        let slideItemCount = Array.from(itemList.querySelectorAll('.related-items-item:not(.is-close)')).length;
        let trackInnerCount = Math.floor((itemList.offsetWidth + gapWidth) / slideWidth);
        maxSlideCount = slideItemCount - trackInnerCount;
        minSlideCount = 0;

        slideCount = Math.min(slideCount, maxSlideCount);
        slideCount = Math.max(slideCount, minSlideCount);

        const translateX = -slideCount * slideWidth;
        itemList.style.transform = `translateX(${translateX}px)`;

        if (maxSlideCount > 0) {
          prevButton.classList.remove('off');
          nextButton.classList.remove('off');
          if (slideCount === minSlideCount) {
            prevButton.disabled = true;
            nextButton.disabled = false;
          } else if (slideCount === maxSlideCount) {
            prevButton.disabled = false;
            nextButton.disabled = true;
          } else {
            prevButton.disabled = false;
            nextButton.disabled = false;
          }
        } else {
          prevButton.classList.add('off');
          nextButton.classList.add('off');
          container.classList.add('ml-0'); // firefox対策：CSS:has()が効かないので直接操作
        }

        // 全削除時にブロックごと非表示に
        var relatedItems = container.closest('.related-items')

        // カウント対象のアイテムがない場合は compareItemsNoneText を表示
        if (slideItemCount < 1) {
          setTimeout(() => { // アイテムの削除アニメーションが終わってからoff-animation
            relatedItems.classList.add('off-animation');
          }, 500);
          setTimeout(() => { // off-animationが終わってからブロック全体をoff
            relatedItems.classList.add('off');
          }, 1000);
        } else { // Modified
          relatedItems.classList.remove('off-animation'); // Modified
          relatedItems.classList.remove('off'); // Modified
        }
      }

      // アイテム削除
      const deleteButtons = container.querySelectorAll('.js-item-delete');

      deleteButtons.forEach((button) => {
        // タッチデバイスとクリックの両方に対応
        button.addEventListener('pointerup', deleteHandler, { once: true });

        // キーボード操作（エンターキー、スペースキー）にも対応
        button.addEventListener('keydown', (event) => {
          // エンターキーまたはスペースキーの場合
          if (event.key === 'Enter' || event.key === ' ') {
            // スペースキーの場合、デフォルトのスクロール等の動作を防ぐ
            event.preventDefault();
            deleteHandler(event);
            removeFromBrowsingHistory(event.currentTarget);
          }
        });
      });

      function deleteHandler(event) {
        const parentItem = event.target.closest('.related-items-item');
        if (parentItem) {
          parentItem.classList.add('is-close');
          // `mousemove` イベントを一時的に無効化(削除ボタンクリック後のスライドをさせない為)
          ctrlTrack.removeEventListener('mousemove', handleMouseMove);

          itemOffTimer(parentItem);
          updateSliderPosition(); // アイテム削除後にスライダー再計算
        }
      }
    });
  };
</script>

<script>
  // PINコード入力フォームのフォーカス移動処理とエラー時にはフォーカスでテキストが選択される様にする
  document.addEventListener("DOMContentLoaded", function() {
    // .box-pincode が存在するかチェック
    const boxPinCode = document.querySelector('.box-pincode');

    if (boxPinCode) {
      // .box-pincode 内の全ての input 要素を取得
      const inputs = boxPinCode.querySelectorAll('input');

      inputs.forEach((input, index) => {
        // IME確定後のイベントをキャッチ
        input.addEventListener('compositionend', (e) => {
          handleInput(e, index);
        });

        // IMEを使わない通常の入力時にも対応
        input.addEventListener('input', (e) => {
          if (!e.isComposing) { // IME使用中はスキップ
            handleInput(e, index);
          }
        });

        // バックスペースキーが押された場合の処理
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && input.value.length === 0) {
            if (index > 0) {
              inputs[index - 1].focus();
            }
          }
        });

        // フォーカス時に .invalid クラスがあれば全選択
        input.addEventListener('focus', () => {
          if (input.classList.contains('invalid')) {
            input.select();
          }
        });
      });

      function handleInput(e, index) {
        const input = e.target;
        if (input.value.length === 1) {
          if (index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        } else if (input.value.length > 1) {
          input.value = input.value.slice(0, 1); // 1文字に制限
        }
      }
    }
  });
</script>
